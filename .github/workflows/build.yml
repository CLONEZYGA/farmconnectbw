name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Run linting
        run: |
          npm --prefix platforms/admin run lint
          npm --prefix platforms/user run lint
          npm --prefix shared run lint

      - name: Run tests
        run: |
          npm --prefix platforms/admin run test
          npm --prefix platforms/user run test

  build-admin:
    name: Build Admin Platform
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    defaults:
      run:
        working-directory: ./platforms/admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v10
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build admin app
        run: eas build --platform ios,android --profile preview
        env:
          PLATFORM: admin
          NODE_ENV: staging

  build-user:
    name: Build User Platform
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    defaults:
      run:
        working-directory: ./platforms/user

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v10
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build user app
        run: eas build --platform ios,android --profile preview
        env:
          PLATFORM: user
          NODE_ENV: staging

  build-shared:
    name: Build Shared Layer
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared components
        run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Run security audit
        run: |
          npm audit --audit-level moderate --prefix platforms/admin
          npm audit --audit-level moderate --prefix platforms/user
          npm audit --audit-level moderate --prefix shared

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-admin, build-user]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Download admin artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-build-artifacts

      - name: Download user artifacts
        uses: actions/download-artifact@v4
        with:
          name: user-build-artifacts

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here
          # For example: deploy to TestFlight, Google Play Internal Testing, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-admin, build-user]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download admin artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-build-artifacts

      - name: Download user artifacts
        uses: actions/download-artifact@v4
        with:
          name: user-build-artifacts

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
          # For example: submit to App Store, Google Play Production, etc.

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

      - name: Notify Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "FarmConnectBW Deployment - ${{ github.ref }}"
          body: |
            Deployment Status: ${{ job.status }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'